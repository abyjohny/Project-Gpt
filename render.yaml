services:
  - type: web
    name: project-gpt-job-hunter
    env: python
    buildCommand: pip install -r requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu
    startCommand: python server.py
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 10000
      - key: GEMINI_API_KEY
        sync: false
